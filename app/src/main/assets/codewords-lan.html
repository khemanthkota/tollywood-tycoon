<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codewords LAN</title><style>*{box-sizing:border-box}body{background:#10131b;color:#f7f1e8;font:16px system-ui;margin:0}main{max-width:1000px;margin:auto;padding:12px}h1{color:#ffd080}a{color:#ffd080}.panel{background:#232a39;border:1px solid #596273;border-radius:13px;padding:13px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}button,input,select{font:inherit;padding:11px;border-radius:9px;border:1px solid #8b90a0;background:#2a3042;color:#fff;min-width:0}button{cursor:pointer}button:disabled{opacity:.4}input{width:100%}.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.tile{min-height:70px;overflow-wrap:anywhere;font-size:clamp(10px,2.7vw,17px);font-weight:700;background:#f1deb7;color:#231b25}.tile.red{background:#ac3545;color:#fff}.tile.blue{background:#3568a9;color:#fff}.tile.neutral{background:#8e816f;color:#fff}.tile.assassin{background:#100e12;color:#fff}.secret{outline:3px solid #f8c96b;outline-offset:-4px}.hide{display:none!important}.muted{color:#c1c9d5}.status{color:#ffd080}#qr{max-width:220px;background:#fff;padding:8px}label{display:block;margin:10px 0}@media(min-width:750px){.tile{min-height:100px}}</style></head><body><main><a href="party-modes.html">← TV Party Play</a><h1>🎬 Cinema Codewords · Offline Party</h1><p class="muted">Host on an Android phone, cast its public board to TV, and join with phones on the same Wi-Fi. Captains receive the hidden key on their own phones only.</p><section id="setup" class="panel"><div id="hostOptions"><h2>Host a board</h2><label>Industry<select id="industry"><option value="tollywood">Tollywood</option><option value="bollywood">Bollywood</option><option value="hollywood">Hollywood</option><option value="mix">Mix & Match</option></select></label><button id="host">Host Codewords</button></div><h2>Join a board</h2><label>Room code<input id="code" maxlength="6" inputmode="numeric" placeholder="6-digit code"></label><label>Your role<select id="role"><option value="player">Player</option><option value="redCaptain">Red captain</option><option value="blueCaptain">Blue captain</option></select></label><button id="join">Join room</button></section><p id="status" class="status" role="status"></p><section id="game" class="hide"><div class="panel"><strong>Room <span id="room"></span></strong><p id="share" class="muted"></p><img id="qr" class="hide" alt="QR to join Codewords room"><p id="turn"></p><p id="note" class="status"></p><p id="remaining"></p><button id="end">End turn</button></div><div id="board" class="board"></div><p id="privacy" class="muted"></p></section></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let ws,host=false,role='player',state=null,ip='';const banks={tollywood:['Prabhas','Baahubali','RRR','Rajamouli','Allu Arjun','Pushpa','NTR','Ram Charan','Mahesh Babu','Pokiri','Chiranjeevi','Samantha','Anushka','Eega','Nani','Jersey','Rangasthalam','Sukumar','Trivikram','Kalki','Salaar','Magadheera','Devara','Pawan Kalyan','Arjun Reddy','Sai Pallavi','Kushi','Gabbar Singh','Dasara','Temper'],bollywood:['Sholay','Dangal','Aamir Khan','Shah Rukh Khan','Kajol','Lagaan','3 Idiots','Karan Johar','Hrithik Roshan','Krrish','Deepika Padukone','Pathaan','Jawan','Ranveer Singh','Gully Boy','Bajirao Mastani','Kareena Kapoor','Andhadhun','Queen','Don','Piku','Barfi','Rockstar','Tamasha','War','Singham','Stree','Animal','Chennai Express','Dil Se'],hollywood:['Titanic','Avatar','James Cameron','Inception','Christopher Nolan','Batman','Joker','Iron Man','Avengers','Spider-Man','Tom Cruise','Jurassic Park','Steven Spielberg','Harry Potter','Hogwarts','Star Wars','Darth Vader','Frozen','Elsa','Toy Story','Woody','The Matrix','Keanu Reeves','John Wick','Oppenheimer','Barbie','Interstellar','Gladiator','Superman','Wicked']};const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};const send=x=>{if(ws?.readyState===1)ws.send(JSON.stringify(x))};const status=x=>$('status').textContent=x;
function connect(address,onOpen){if(ws&&ws.readyState<=1)ws.close();ws=new WebSocket('ws://'+address+':3000');ws.onopen=onOpen;ws.onerror=()=>status('Connection failed. Check Wi-Fi and host address.');ws.onclose=()=>status('Disconnected. Rejoin the room to continue.');ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='error'){status(m.message);return}if(m.type==='code_created'||m.type==='code_joined'){if(m.code)$('code').value=m.code;status('Connected');$('setup').classList.add('hide')}if(m.type==='code_state'){state=m;render()}}}
function render(){if(!state)return;$('game').classList.remove('hide');$('room').textContent=state.code;$('turn').textContent=state.winner?'Winner: '+state.winner.toUpperCase():'Turn: '+state.turn.toUpperCase();$('note').textContent=state.note;const red=state.cards.filter(c=>c.color==='red'&&!c.open).length,blue=state.cards.filter(c=>c.color==='blue'&&!c.open).length;$('remaining').textContent=(role==='player'&&!host?'Revealed cards update live':'Red remaining: '+red+' · Blue remaining: '+blue);$('privacy').textContent=host?'Public TV board: no unrevealed secret colors are sent.':'Captains: keep this phone private. Do not cast captain view.';$('end').disabled=!!state.winner||(!host&&role!=='player');const board=$('board');board.replaceChildren();state.cards.forEach((c,i)=>{const tile=document.createElement('button');tile.className='tile'+(c.color?' '+c.color:'')+(!c.open&&c.color?' secret':'');tile.textContent=c.name;tile.disabled=c.open||!!state.winner||(!host&&role!=='player');tile.onclick=()=>send({type:'code_guess',index:i});board.appendChild(tile)})}
$('host').onclick=()=>{if(!window.CinemaLocalParty){status('Hosting requires the Android app, not a browser.');return}const address=window.CinemaLocalParty.start();if(!address||address.startsWith('ERROR:')){status(address||'Cannot start server');return}ip=address;host=true;role='host';const pool=$('industry').value==='mix'?Object.values(banks).flat():banks[$('industry').value];const names=shuffle([...new Set(pool)]).slice(0,25);connect(ip,()=>send({type:'code_create',names}));const link='http://'+ip+':8080/codewords-lan.html';$('share').textContent='Join link: '+link;$('qr').src=window.CinemaLocalParty.qr(link);$('qr').classList.remove('hide')};
$('join').onclick=()=>{const code=$('code').value.trim();if(!/^\d{6}$/.test(code)){status('Enter a 6-digit room code');return}role=$('role').value;const address=new URLSearchParams(location.search).get('host')||location.hostname;if(!address||address==='localhost'||location.protocol==='file:'){status('Open the host QR link on your phone first');return}connect(address,()=>send({type:'code_join',code,role}))};
$('end').onclick=()=>send({type:'code_end'});const params=new URLSearchParams(location.search);if(params.has('code'))$('code').value=params.get('code');if(location.protocol==='http:'||location.protocol==='https:')$('hostOptions').classList.add('hide');
})();</script></body></html>
