<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codewords LAN</title><style>*{box-sizing:border-box}body{background:#10131b;color:#f7f1e8;font:16px system-ui;margin:0}main{max-width:1000px;margin:auto;padding:12px}h1{color:#ffd080}a{color:#ffd080}.panel{background:#232a39;border:1px solid #596273;border-radius:13px;padding:13px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}button,input,select{font:inherit;padding:11px;border-radius:9px;border:1px solid #8b90a0;background:#2a3042;color:#fff;min-width:0}button{cursor:pointer}button:disabled{opacity:.4}input{width:100%}.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.tile{min-height:70px;overflow-wrap:anywhere;font-size:clamp(10px,2.7vw,17px);font-weight:700;background:#f1deb7;color:#231b25}.tile.red{background:#ac3545;color:#fff}.tile.blue{background:#3568a9;color:#fff}.tile.neutral{background:#8e816f;color:#fff}.tile.assassin{background:#100e12;color:#fff}.secret{outline:3px solid #f8c96b;outline-offset:-4px}.hide{display:none!important}.muted{color:#c1c9d5}.status{color:#ffd080}#qr{max-width:220px;background:#fff;padding:8px}label{display:block;margin:10px 0}@media(min-width:750px){.tile{min-height:100px}}body{background:radial-gradient(ellipse at 50% 0%,#593025 0%,#19141a 62%,#0d1018 100%)}main{max-width:1500px}.board{gap:clamp(4px,.8vw,12px);padding:clamp(8px,1.6vw,22px);border:8px solid #4c2b24;border-radius:20px;background:linear-gradient(135deg,#8e4632,#381c21 48%,#a45a35);box-shadow:inset 0 0 0 2px #d28a51,0 18px 40px #0009}.tile{position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;aspect-ratio:1.64;min-height:0;padding:5px;border:3px solid #a87b56;border-radius:7px;background:linear-gradient(160deg,#f9f0dc,#d8c4a5);box-shadow:0 4px 0 #261718,0 7px 12px #0007;color:#241a20;font-size:clamp(10px,1.65vw,25px);text-transform:uppercase;letter-spacing:.02em;transition:transform .16s,background .2s}.tile .visual{font-size:clamp(23px,4.5vw,72px);line-height:1.05;filter:drop-shadow(0 4px 2px #0004)}.tile .visual-label{font-size:clamp(8px,1.1vw,16px);line-height:1.1}.tile.red{background:linear-gradient(145deg,#e36c65,#8c2639);border-color:#ffada1;color:white}.tile.blue{background:linear-gradient(145deg,#76bce6,#24538f);border-color:#b8e5ff;color:white}.tile.neutral{background:linear-gradient(145deg,#b8a898,#746452);color:white}.tile.assassin{background:linear-gradient(145deg,#55505b,#17151e);color:white}.tile:disabled{opacity:1}.tile.secret{outline:3px solid #ffd36d;outline-offset:-7px}.tile:not(:disabled):active{transform:scale(.97)}.tv-header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 18px;background:#17141dd9;border:1px solid #af6d45;border-radius:12px;margin-bottom:12px}.tv-header strong{color:#ffd28e}.tv-header p{margin:3px}.tv-scores{display:flex;gap:14px;font-size:clamp(14px,2vw,25px);font-weight:900}.tv-scores span{padding:7px 13px;border-radius:9px}.tv-scores .r{background:#982f43}.tv-scores .b{background:#285b9c}.tv-banner{font-size:clamp(18px,2.8vw,34px);text-align:center;text-transform:uppercase;font-weight:900;letter-spacing:.06em;color:#ffd18c;margin:14px 0;text-shadow:0 3px 4px #000}.host-board #end{display:none}@media(min-width:900px){.tile{font-size:clamp(15px,2vw,30px)}main{padding:18px 26px}}@media(max-width:520px){.board{gap:3px;padding:5px;border-width:4px}.tile{border-width:1px;border-radius:4px;padding:2px}.tile .visual{font-size:clamp(16px,5vw,27px)}.tile .visual-label{font-size:8px}.tv-header{padding:8px}.tv-scores{gap:5px}}@media(min-width:1000px) and (orientation:landscape){.host-board .tile{aspect-ratio:1.8}.host-board h1,.host-board main>a,.host-board main>p.muted,.host-board #privacy{display:none}} </style></head><body><main><a href="party-modes.html">← TV Party Play</a><h1>🎬 Cinema Codewords · Offline Party</h1><p class="muted">Host on an Android phone, open the separate Smart TV browser display, and join with phones on the same Wi-Fi. Captains receive the hidden key on their own phones only.</p><section id="setup" class="panel"><div id="hostOptions"><h2>Host a board</h2><label>Industry<select id="industry"><option value="tollywood">Tollywood</option><option value="bollywood">Bollywood</option><option value="hollywood">Hollywood</option><option value="mix">Mix & Match</option></select></label><button id="host">Host Codewords</button></div><h2>Join a board</h2><label>Room code<input id="code" maxlength="6" inputmode="numeric" placeholder="6-digit code"></label><label>Your role<select id="role"><option value="player">Player</option><option value="redCaptain">Red captain</option><option value="blueCaptain">Blue captain</option></select></label><button id="join">Join room</button></section><p id="status" class="status" role="status"></p><section id="game" class="hide"><div class="tv-header"><div><strong>🎬 CINEMA CODEWORDS · ROOM <span id="room"></span></strong><div class="tv-scores"><span class="r" id="redScore">RED 9</span><span class="b" id="blueScore">BLUE 8</span></div></div><div><strong id="turn"></strong><p id="remaining"></p></div></div><div class="panel" id="joinInfo"><p id="share" class="muted"></p><p id="tvLink" class="muted"></p><img id="qr" class="hide" alt="QR to join Codewords room"><button id="end">End turn</button></div><div id="note" class="tv-banner"></div><div id="board" class="board"></div><p id="privacy" class="muted"></p></section></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let ws,host=false,role='player',state=null,ip='';const banks={tollywood:['Prabhas','Baahubali','RRR','Rajamouli','Allu Arjun','Pushpa','NTR','Ram Charan','Mahesh Babu','Pokiri','Chiranjeevi','Samantha','Anushka','Eega','Nani','Jersey','Rangasthalam','Sukumar','Trivikram','Kalki','Salaar','Magadheera','Devara','Pawan Kalyan','Arjun Reddy','Sai Pallavi','Kushi','Gabbar Singh','Dasara','Temper'],bollywood:['Sholay','Dangal','Aamir Khan','Shah Rukh Khan','Kajol','Lagaan','3 Idiots','Karan Johar','Hrithik Roshan','Krrish','Deepika Padukone','Pathaan','Jawan','Ranveer Singh','Gully Boy','Bajirao Mastani','Kareena Kapoor','Andhadhun','Queen','Don','Piku','Barfi','Rockstar','Tamasha','War','Singham','Stree','Animal','Chennai Express','Dil Se'],hollywood:['Titanic','Avatar','James Cameron','Inception','Christopher Nolan','Batman','Joker','Iron Man','Avengers','Spider-Man','Tom Cruise','Jurassic Park','Steven Spielberg','Harry Potter','Hogwarts','Star Wars','Darth Vader','Frozen','Elsa','Toy Story','Woody','The Matrix','Keanu Reeves','John Wick','Oppenheimer','Barbie','Interstellar','Gladiator','Superman','Wicked']};const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};const send=x=>{if(ws?.readyState===1)ws.send(JSON.stringify(x))};const status=x=>$('status').textContent=x;
function connect(address,onOpen){if(ws&&ws.readyState<=1)ws.close();ws=new WebSocket('ws://'+address+':3000');ws.onopen=onOpen;ws.onerror=()=>status('Connection failed. Check Wi-Fi and host address.');ws.onclose=()=>status('Disconnected. Rejoin the room to continue.');ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='error'){status(m.message);return}if(m.type==='code_created'||m.type==='code_joined'){if(m.code)$('code').value=m.code;if(m.type==='code_created'&&ip){$('tvLink').textContent='Smart TV: http://'+ip+':8080/tv.html?mode=code&code='+m.code;const link='http://'+ip+':8080/codewords-lan.html?code='+encodeURIComponent(m.code);$('share').textContent='Join link: '+link;$('qr').src=window.CinemaLocalParty.qr(link);$('qr').classList.remove('hide')}status('Connected');$('setup').classList.add('hide')}if(m.type==='code_state'){state=m;render()}}}
const pictures={'Prabhas':'👑','Baahubali':'⚔️','RRR':'🔥','Rajamouli':'🎬','Pushpa':'🌲','NTR':'🐯','Chiranjeevi':'🌟','Eega':'🐝','Kalki':'🚀','Salaar':'🗡️','Devara':'🌊','Jersey':'🏏','Sholay':'🔫','Dangal':'🤼','3 Idiots':'🎓','Krrish':'🦸','Pathaan':'🕵️','Jawan':'🪖','Queen':'👑','Don':'♠️','War':'⚔️','Stree':'👻','Titanic':'🚢','Avatar':'🌌','Batman':'🦇','Joker':'🃏','Iron Man':'🤖','Avengers':'🛡️','Spider-Man':'🕷️','Jurassic Park':'🦖','Harry Potter':'🪄','Hogwarts':'🏰','Star Wars':'🌠','Darth Vader':'🌑','Frozen':'❄️','Elsa':'❄️','Toy Story':'🧸','Woody':'🤠','The Matrix':'💊','John Wick':'🐕','Oppenheimer':'⚛️','Barbie':'🎀','Interstellar':'🪐','Gladiator':'🏛️','Superman':'🦸','Wicked':'🧙'};function render(){if(!state)return;$('game').classList.remove('hide');document.body.classList.toggle('host-board',host);$('joinInfo').classList.toggle('hide',!host);$('room').textContent=state.code;$('turn').textContent=state.winner?'Winner: '+state.winner.toUpperCase():'Turn: '+state.turn.toUpperCase();$('note').textContent=state.note;const red=state.cards.filter(c=>c.color==='red'&&!c.open).length,blue=state.cards.filter(c=>c.color==='blue'&&!c.open).length;$('remaining').textContent='25 cards · '+state.cards.filter(c=>c.open).length+' revealed';$('redScore').textContent='🔴 RED '+(state.cards.filter(c=>c.color==='red'&&c.open).length)+' / 9';$('blueScore').textContent='🔵 BLUE '+(state.cards.filter(c=>c.color==='blue'&&c.open).length)+' / 8';$('privacy').textContent=host?'Public TV board: no unrevealed secret colors are sent.':'Captains: keep this phone private. Do not cast captain view.';$('end').disabled=!!state.winner||(!host&&role!=='player');const board=$('board');board.replaceChildren();state.cards.forEach((c,i)=>{const tile=document.createElement('button');tile.className='tile'+(c.color?' '+c.color:'')+(!c.open&&c.color?' secret':'');if(pictures[c.name]&&i%2===0){const v=document.createElement('span');v.className='visual';v.textContent=pictures[c.name];const label=document.createElement('span');label.className='visual-label';label.textContent=c.name;tile.append(v,label)}else{tile.textContent=c.name}tile.setAttribute('aria-label',c.name+(c.open?' revealed':''));tile.disabled=c.open||!!state.winner||(!host&&role!=='player');tile.onclick=()=>send({type:'code_guess',index:i});board.appendChild(tile)})}
$('host').onclick=()=>{if(!window.CinemaLocalParty){status('Hosting requires the Android app, not a browser.');return}const address=window.CinemaLocalParty.start();if(!address||address.startsWith('ERROR:')){status(address||'Cannot start server');return}ip=address;host=true;role='host';const pool=$('industry').value==='mix'?Object.values(banks).flat():banks[$('industry').value];const names=shuffle([...new Set(pool)]).slice(0,25);connect(ip,()=>send({type:'code_create',names}));const link='http://'+ip+':8080/codewords-lan.html';$('share').textContent='Join link: '+link;$('qr').src=window.CinemaLocalParty.qr(link);$('qr').classList.remove('hide')};
$('join').onclick=()=>{const code=$('code').value.trim();if(!/^\d{6}$/.test(code)){status('Enter a 6-digit room code');return}role=$('role').value;const address=new URLSearchParams(location.search).get('host')||location.hostname;if(!address||address==='localhost'||location.protocol==='file:'){status('Open the host QR link on your phone first');return}connect(address,()=>send({type:'code_join',code,role}))};
$('end').onclick=()=>send({type:'code_end'});const params=new URLSearchParams(location.search);if(params.has('code'))$('code').value=params.get('code');if(location.protocol==='http:'||location.protocol==='https:')$('hostOptions').classList.add('hide');
})();</script></body></html>
