<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cinema Tycoon · Smart TV</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#572b35,#10131b 70%);color:#fff3e1;font:clamp(16px,2vw,28px) system-ui,sans-serif}main{width:min(96vw,1600px);margin:auto;padding:2vh 1vw}h1,h2{color:#ffd18a;margin:.4em 0}h1{text-align:center;font-size:clamp(28px,4vw,60px)}.setup{max-width:850px;margin:6vh auto;padding:28px;border:2px solid #b57c4d;border-radius:20px;background:#241d2d}label{display:block;margin:16px 0}input,select,button{font:inherit;padding:12px;border-radius:10px;border:2px solid #b88c61;background:#191e2a;color:white}input{width:100%}button{background:#f4c277;color:#211520;font-weight:800;cursor:pointer;padding:12px 28px}.hidden{display:none!important}.muted{color:#bdb7c6}.header{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:3px solid #bc8358;padding:12px}.tag{padding:10px 20px;border-radius:10px;background:#352637;color:#ffda9a}.stage{text-align:center;font-size:clamp(20px,3vw,42px);margin:2vh 0;color:#ffd18a}.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(5px,.7vw,13px);padding:clamp(8px,1.5vw,20px);background:linear-gradient(135deg,#9b5438,#3a1d25,#ad6843);border:5px solid #db9b61;border-radius:18px}.tile{display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;aspect-ratio:1.75;border:3px solid #a47e5c;border-radius:8px;background:linear-gradient(145deg,#fff0d4,#d9c19b);color:#241824;font-size:clamp(11px,1.8vw,28px);font-weight:850;overflow-wrap:anywhere;padding:4px}.tile.red{background:#ac3447;color:white;border-color:#e97780}.tile.blue{background:#2d65a9;color:white;border-color:#80b8e6}.tile.neutral{background:#8d8071;color:white}.tile.assassin{background:#17141c;color:white}.picture{font-size:clamp(24px,4vw,66px)}.caption{font-size:clamp(9px,1.1vw,17px)}.bidhero{text-align:center;margin:7vh auto 3vh;max-width:1100px;padding:5vh 2vw;background:#211b2cbf;border:3px solid #b67e52;border-radius:24px}.bidhero h2{font-size:clamp(38px,7vw,110px);overflow-wrap:anywhere}.amount{font-size:clamp(32px,5vw,80px);color:#f5c679;font-weight:900}.players{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}.player{background:#352537;border:1px solid #9e6e55;border-radius:10px;padding:12px}.note{text-align:center;color:#e4d3b9;font-size:.7em}#status{color:#ffd18a}.triviahero{margin:5vh auto;text-align:center;max-width:1300px}.triviahero h2{font-size:clamp(32px,4.5vw,74px);line-height:1.2}.triviaoptions{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:4vh auto}.triviaoption{border:3px solid #9c7387;border-radius:18px;background:#32253c;padding:2vh 1vw;font-size:clamp(19px,2.5vw,43px)}.triviaoption.correct{background:#245b3e;border-color:#a2efb7}.leaderboard{display:flex;justify-content:center;gap:16px;flex-wrap:wrap}.leaderboard span{padding:12px 20px;background:#34253e;border-radius:12px}</style></head><body><main><section id="setup" class="setup"><h1>📺 Cinema Tycoon TV</h1><p>Open this page in your smart TV browser on the same Wi-Fi as the Android host phone. No mirroring needed.</p><label>Game<select id="mode"><option value="bid">🎬 Cinema Bid</option><option value="code">🔤 Cinema Codewords</option><option value="trivia">🧠 Cinema Trivia</option></select></label><label>Six-digit room code<input id="room" inputmode="numeric" maxlength="6" placeholder="123456"></label><button id="join">Connect TV</button><p id="status" role="status"></p><p class="muted">The host phone must have created the matching game room first. Trivia uses a starter question bank and host-controlled rounds.</p></section><section id="display" class="hidden"><div class="header"><strong>🎬 CINEMA TYCOON</strong><span id="roomLabel" class="tag"></span><span id="meta" class="tag"></span></div><div id="stage" class="stage"></div><div id="board" class="board hidden"></div><div id="bidView" class="hidden"><div class="bidhero"><div id="category"></div><h2 id="celebrity"></h2><div id="bid" class="amount"></div><div id="clock"></div></div><div id="players" class="players"></div></div><div id="triviaView" class="hidden triviahero"><h2 id="triviaQuestion"></h2><div id="triviaOptions" class="triviaoptions"></div><div id="triviaScores" class="leaderboard"></div></div><p id="note" class="note"></p></section></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),params=new URLSearchParams(location.search);let socket;const pict={'Baahubali':'⚔️','RRR':'🔥','Pushpa':'🌲','Eega':'🐝','Kalki':'🚀','Salaar':'🗡️','Devara':'🌊','Jersey':'🏏','Sholay':'🔫','Dangal':'🤼','Krrish':'🦸','Queen':'👑','Titanic':'🚢','Avatar':'🌌','Batman':'🦇','Joker':'🃏','Iron Man':'🤖','Avengers':'🛡️','Spider-Man':'🕷️','Jurassic Park':'🦖','Harry Potter':'🪄','Hogwarts':'🏰','Star Wars':'🌠','Frozen':'❄️','Toy Story':'🧸','The Matrix':'💊','John Wick':'🐕','Barbie':'🎀','Interstellar':'🪐'};function connect(){const mode=$('mode').value,code=$('room').value.trim();if(!/^\d{6}$/.test(code)){$('status').textContent='Enter a six-digit room code.';return}if(socket)socket.close();socket=new WebSocket('ws://'+location.hostname+':3000');socket.onopen=()=>socket.send(JSON.stringify({type:mode==='code'?'code_watch':mode==='trivia'?'trivia_watch':'watch',code}));socket.onerror=()=>{$('status').textContent='Connection failed. Check that TV and host share Wi-Fi.'};socket.onclose=()=>{$('note').textContent='TV disconnected. Reopen this page to reconnect.'};socket.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='error'){$('status').textContent=m.message;return}if(m.type==='code_state'||m.type==='state'||m.type==='trivia_state'){$('setup').classList.add('hidden');$('display').classList.remove('hidden');$('roomLabel').textContent='ROOM '+code;if(m.type==='code_state')renderCode(m);else if(m.type==='trivia_state')renderTrivia(m);else renderBid(m.state)}}}function renderTrivia(s){$('board').classList.add('hidden');$('bidView').classList.add('hidden');$('triviaView').classList.remove('hidden');$('stage').textContent=s.finished?'🏆 FINAL RESULTS':s.index<0?'🎬 TRIVIA LOBBY':'🧠 QUESTION '+(s.index+1)+' / '+s.total;$('meta').textContent=s.players.filter(p=>p.answered).length+' / '+s.players.length+' ANSWERED';$('triviaQuestion').textContent=s.finished?'Congratulations!':s.question||'Waiting for host to start…';$('triviaOptions').replaceChildren();s.options.forEach((option,i)=>{const d=document.createElement('div');d.className='triviaoption'+(s.revealed&&s.correct===i?' correct':'');d.textContent=String.fromCharCode(65+i)+'. '+option;$('triviaOptions').appendChild(d)});$('triviaScores').replaceChildren();s.players.forEach((p,i)=>{const d=document.createElement('span');d.textContent=(i+1)+'. '+p.name+' · '+p.score+' pts';$('triviaScores').appendChild(d)});$('note').textContent=s.revealed?'Correct answer highlighted in green':s.finished?'Round complete':'Answer privately on your phone'}function renderCode(s){$('triviaView').classList.add('hidden');$('board').classList.remove('hidden');$('bidView').classList.add('hidden');$('stage').textContent=s.winner?'🏆 '+s.winner.toUpperCase()+' WINS!':'🔴 RED vs 🔵 BLUE · '+s.turn.toUpperCase()+' TURN';$('meta').textContent=s.cards.filter(c=>c.open).length+' / 25 REVEALED';$('note').textContent=s.note||'Captains keep secret colors on their phones';$('board').replaceChildren();s.cards.forEach((c,i)=>{const d=document.createElement('div');d.className='tile'+(c.open&&c.color?' '+c.color:'');if(pict[c.name]&&i%2===0){const icon=document.createElement('span');icon.className='picture';icon.textContent=pict[c.name];const name=document.createElement('span');name.className='caption';name.textContent=c.name;d.append(icon,name)}else d.textContent=c.name;$('board').appendChild(d)})}function renderBid(s){$('triviaView').classList.add('hidden');$('board').classList.add('hidden');$('bidView').classList.remove('hidden');$('stage').textContent=s.phase==='auction'?'🔨 LIVE AUCTION':s.phase==='movies'?'🎬 MOVIE MAKING':'🏆 RESULTS';$('meta').textContent=s.players.length+' PLAYERS';$('category').textContent=s.lot?s.lot.kind.toUpperCase():'NEXT LOT';$('celebrity').textContent=s.lot?s.lot.name:'Waiting for host…';$('bid').textContent=s.high?'₹'+s.high.amount+' Cr · '+s.high.name:'No bids yet';$('clock').textContent=s.remaining==null?'':s.remaining+' seconds remaining';$('players').replaceChildren();s.players.forEach(p=>{const d=document.createElement('div');d.className='player';d.textContent=p.name+' · ₹'+p.budget+' Cr';$('players').appendChild(d)});$('note').textContent=s.history.length?'Latest: '+s.history[s.history.length-1].lot+' → '+s.history[s.history.length-1].outcome:''}if(params.has('code'))$('room').value=params.get('code');if(params.has('mode'))$('mode').value=params.get('mode');$('join').onclick=connect;})();</script></body></html>
