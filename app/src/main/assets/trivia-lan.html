<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cinema Trivia · LAN</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#54243e,#11121b 70%);color:#fff2e6;font:17px system-ui}main{max-width:850px;margin:auto;padding:18px}h1{color:#ffd18c}.panel{background:#282134;border:1px solid #85617b;border-radius:16px;padding:20px;margin:16px 0}.hidden{display:none!important}input,button{font:inherit;padding:12px;border-radius:9px}input{width:100%;background:#181722;color:white;border:1px solid #927b88}button{background:#f5c37b;color:#201422;border:0;font-weight:800;cursor:pointer;margin:5px}button:disabled{opacity:.45}a{color:#ffd18c}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.answers button{background:#43334c;color:white;border:2px solid #8e7194;min-height:70px}.answers button.chosen{border-color:#ffd18c;background:#65435b}.answers button.correct{background:#276847;border-color:#a6edc3}.answers button.wrong{background:#853747}.scores{display:flex;flex-wrap:wrap;gap:10px}.score{background:#382c43;padding:12px;border-radius:10px}.muted{color:#cfc3d4}.status{color:#ffd18c}</style></head><body><main><a href="party-modes.html">← TV Party Play</a><h1>🧠 Cinema Trivia · Wi-Fi Party</h1><p class="muted">Host on an Android phone. Players answer privately on their phones. Open the TV display on the same Wi-Fi.</p><section id="setup" class="panel"><label>Film industry<select id="industry" style="font:inherit;padding:10px;background:#181722;color:white"><option value="all">Mix & Match</option><option value="tollywood">Tollywood</option><option value="bollywood">Bollywood</option><option value="hollywood">Hollywood</option><option value="kollywood">Kollywood</option><option value="mollywood">Mollywood</option><option value="sandalwood">Sandalwood</option></select></label><label>Difficulty <select id="difficulty" style="font:inherit;padding:10px;background:#181722;color:white"><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard" selected>Hard</option><option value="expert">Expert</option></select></label><label>Question timer<select id="seconds" style="font:inherit;padding:10px;background:#181722;color:white"><option>15</option><option selected>30</option><option>45</option><option>60</option></select> seconds</label><button id="host">🎬 Host Trivia</button><h2>Join a room</h2><label>Room code<input id="code" maxlength="6" inputmode="numeric" placeholder="6-digit code"></label><label>Your name<input id="name" maxlength="24" placeholder="Player name"></label><button id="join">Join Trivia</button></section><p id="status" class="status" role="status"></p><section id="game" class="hidden"><div class="panel"><h2>Room <span id="room"></span></h2><p id="tvLink" class="muted"></p><img id="qr" class="hidden" width="190" alt="Scan to join Trivia" style="background:white;padding:8px"><p id="progress"></p><h2 id="countdown"></h2><div id="hostControls" class="hidden"><button id="next">Start / Next Question</button><button id="reveal">Reveal Answers</button></div></div><section class="panel"><div id="visualClue" class="hidden" style="font-size:clamp(38px,8vw,80px);text-align:center;padding:20px;background:#171420;border-radius:14px;letter-spacing:.1em" aria-label="Illustrated scene clue"></div><h2 id="question">Waiting for host…</h2><div id="answers" class="answers"></div><p id="feedback"></p></section><section class="panel"><h2>Leaderboard</h2><div id="scores" class="scores"></div></section></section></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),params=new URLSearchParams(location.search);let ws,host=false,ip='',state=null,roomCode='',playerName='',retry=0;const send=m=>{if(ws?.readyState===1)ws.send(JSON.stringify(m))},status=s=>$('status').textContent=s;function connect(address,first){if(ws)ws.close();ws=new WebSocket('ws://'+address+':3000');ws.onopen=()=>send(first);ws.onerror=()=>status('Connection failed. Confirm same Wi-Fi and host IP.');ws.onclose=()=>{status('Disconnected. Attempting to reconnect…');if(!host&&roomCode&&retry<10){const delay=Math.min(10000,1000*Math.pow(1.6,retry++));setTimeout(()=>connect(params.get('host')||location.hostname,{type:'trivia_join',code:roomCode,name:playerName,token:sessionStorage.getItem('trivia-token-'+roomCode)||''}),delay)}};ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='error'){status(m.message);return}if(m.type==='trivia_created'){const link='http://'+ip+':8080/trivia-lan.html?code='+m.code;$('tvLink').textContent='TV: http://'+ip+':8080/tv.html?mode=trivia&code='+m.code+' · Player join: '+link;if(window.CinemaLocalParty?.qr){$('qr').src=window.CinemaLocalParty.qr(link);$('qr').classList.remove('hidden')}}if(m.type==='trivia_state'){state=m;render();$('setup').classList.add('hidden');$('game').classList.remove('hidden');status('Connected')}if(m.type==='trivia_joined'){retry=0;if(m.token)sessionStorage.setItem('trivia-token-'+roomCode,m.token);status('Joined the room')}};}function tick(){if(!state)return;$('countdown').textContent=state.deadline&&!state.revealed?'⏱ '+Math.max(0,Math.ceil((state.deadline-Date.now())/1000))+'s':''}setInterval(tick,250);function render(){const s=state;tick();$('room').textContent=s.code;$('progress').textContent=s.finished?'Round complete':s.index<0?'Waiting to start':'Question '+(s.index+1)+' of '+s.total+' · '+s.players.filter(p=>p.answered).length+' answered';$('visualClue').classList.toggle('hidden',!s.visual||s.finished);$('visualClue').textContent=s.visual||'';$('question').textContent=s.finished?'🏆 Final leaderboard':s.question||'Waiting for host to start…';$('hostControls').classList.toggle('hidden',!host);$('next').disabled=s.finished||(s.index>=0&&!s.revealed);$('reveal').disabled=s.finished||s.index<0||s.revealed;const answers=$('answers');answers.replaceChildren();(s.options||[]).forEach((option,i)=>{const b=document.createElement('button');b.textContent=String.fromCharCode(65+i)+'. '+option;b.disabled=host||s.revealed||s.finished||s.yourAnswer>=0||s.index<0||(s.deadline&&Date.now()>=s.deadline);b.className=(s.yourAnswer===i?'chosen ':'')+(s.revealed&&s.correct===i?'correct':s.revealed&&s.yourAnswer===i?'wrong':'');b.onclick=()=>send({type:'trivia_answer',answer:i});answers.appendChild(b)});$('feedback').textContent=s.revealed?'Correct answer: '+s.options[s.correct]:s.yourAnswer>=0?'Answer submitted. Waiting for reveal.':'Choose one answer.';const scores=$('scores');scores.replaceChildren();s.players.forEach((p,i)=>{const d=document.createElement('div');d.className='score';d.textContent=(i+1)+'. '+p.name+' · '+p.score+' pts'+(p.answered?' ✓':'');scores.appendChild(d)})} $('host').onclick=()=>{if(!window.CinemaLocalParty){status('Host requires the Android app.');return}ip=window.CinemaLocalParty.start();if(!ip||ip.startsWith('ERROR:')){status(ip||'Unable to start server');return}host=true;connect(ip,{type:'trivia_create',seconds:Number($('seconds').value),industry:$('industry').value,difficulty:$('difficulty').value})};$('join').onclick=()=>{const code=$('code').value.trim(),name=$('name').value.trim();if(!/^\d{6}$/.test(code)||!name){status('Enter room code and your name.');return}const address=params.get('host')||location.hostname;if(!address||location.protocol==='file:'){status('Open the host join URL from the QR code.');return}roomCode=code;playerName=name;retry=0;connect(address,{type:'trivia_join',code,name,token:sessionStorage.getItem('trivia-token-'+code)||''})};$('next').onclick=()=>send({type:'trivia_next'});$('reveal').onclick=()=>send({type:'trivia_reveal'});if(params.has('code'))$('code').value=params.get('code');if(location.protocol==='http:')$('host').classList.add('hidden');})();</script></body></html>
