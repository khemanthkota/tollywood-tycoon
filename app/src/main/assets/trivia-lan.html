<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cinema Trivia · LAN</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#54243e,#11121b 70%);color:#fff2e6;font:17px system-ui}main{max-width:850px;margin:auto;padding:18px}h1{color:#ffd18c}.panel{background:#282134;border:1px solid #85617b;border-radius:16px;padding:20px;margin:16px 0}.hidden{display:none!important}input,button{font:inherit;padding:12px;border-radius:9px}input{width:100%;background:#181722;color:white;border:1px solid #927b88}button{background:#f5c37b;color:#201422;border:0;font-weight:800;cursor:pointer;margin:5px}button:disabled{opacity:.45}a{color:#ffd18c}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.answers button{background:#43334c;color:white;border:2px solid #8e7194;min-height:70px}.answers button.chosen{border-color:#ffd18c;background:#65435b}.answers button.correct{background:#276847;border-color:#a6edc3}.answers button.wrong{background:#853747}.scores{display:flex;flex-wrap:wrap;gap:10px}.score{background:#382c43;padding:12px;border-radius:10px}.muted{color:#cfc3d4}.status{color:#ffd18c}</style></head><body><main><a href="party-modes.html">← TV Party Play</a><h1>🧠 Cinema Trivia · Wi-Fi Party</h1><p class="muted">Host on an Android phone. Players answer privately on their phones. Open the TV display on the same Wi-Fi.</p><section id="setup" class="panel"><label>Film industry<select id="industry" style="font:inherit;padding:10px;background:#181722;color:white"><option value="all">Mix & Match</option><option value="tollywood">Tollywood</option><option value="bollywood">Bollywood</option><option value="hollywood">Hollywood</option><option value="kollywood">Kollywood</option><option value="mollywood">Mollywood</option><option value="sandalwood">Sandalwood</option></select></label><label>Difficulty <select id="difficulty" style="font:inherit;padding:10px;background:#181722;color:white"><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard" selected>Hard</option><option value="expert">Expert</option></select></label><label>Question timer<select id="seconds" style="font:inherit;padding:10px;background:#181722;color:white"><option>15</option><option selected>30</option><option>45</option><option>60</option></select> seconds</label><button id="host">🎬 Host Trivia</button><h2>Join a room</h2><label>Room code<input id="code" maxlength="6" inputmode="numeric" placeholder="6-digit code"></label><label>Your name<input id="name" maxlength="24" placeholder="Player name"></label><button id="join">Join Trivia</button></section><p id="status" class="status" role="status"></p><section id="game" class="hidden"><div class="panel"><h2>Room <span id="room"></span></h2><p id="tvLink" class="muted"></p><img id="qr" class="hidden" width="190" alt="Scan to join Trivia" style="background:white;padding:8px"><p id="progress"></p><h2 id="countdown"></h2><div id="hostControls" class="hidden"><button id="next">Start / Next Question</button><button id="reveal">Reveal Answers</button></div></div><section class="panel"><div id="visualClue" class="hidden" style="font-size:clamp(38px,8vw,80px);text-align:center;padding:20px;background:#171420;border-radius:14px;letter-spacing:.1em" aria-label="Illustrated scene clue"></div><h2 id="question">Waiting for host…</h2><div id="answers" class="answers"></div><p id="feedback"></p></section><section class="panel"><h2>Leaderboard</h2><div id="scores" class="scores"></div></section></section></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),params=new URLSearchParams(location.search);let ws,host=false,ip='',state=null,roomCode='',playerName='',retry=0;const send=m=>{if(ws?.readyState===1)ws.send(JSON.stringify(m))},status=s=>$('status').textContent=s;function connect(address,first){if(ws)ws.close();ws=new WebSocket('ws://'+address+':3000/ws');ws.onopen=()=>send(first);ws.onerror=()=>status('Connection failed. Confirm same Wi-Fi and host IP.');ws.onclose=()=>{status('Disconnected. Attempting to reconnect…');if(!host&&roomCode&&retry<10){const delay=Math.min(10000,1000*Math.pow(1.6,retry++));setTimeout(()=>connect(params.get('host')||location.hostname,{type:'trivia_join',code:roomCode,name:playerName,token:sessionStorage.getItem('trivia-token-'+roomCode)||''}),delay)}};ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='error'){status(m.message);return}if(m.type==='trivia_created'){const link='http://'+ip+':8080/trivia-lan.html?code='+m.code;$('tvLink').textContent='TV: http://'+ip+':8080/tv.html?mode=trivia&code='+m.code+' · Player join: '+link;if(window.CinemaLocalParty?.qr){$('qr').src=window.CinemaLocalParty.qr(link);$('qr').classList.remove('hidden')}}if(m.type==='trivia_state'){state=m;render();$('setup').classList.add('hidden');$('game').classList.remove('hidden');status('Connected')}if(m.type==='trivia_joined'){retry=0;if(m.token)sessionStorage.setItem('trivia-token-'+roomCode,m.token);status('Joined the room')}};}function tick(){if(!state)return;$('countdown').textContent=state.deadline&&!state.revealed?'⏱ '+Math.max(0,Math.ceil((state.deadline-Date.now())/1000))+'s':''}setInterval(tick,250);function render(){const s=state;tick();$('room').textContent=s.code;$('progress').textContent=s.finished?'Round complete':s.index<0?'Waiting to start':'Question '+(s.index+1)+' of '+s.total+' · '+s.players.filter(p=>p.answered).length+' answered';$('visualClue').classList.toggle('hidden',!s.visual||s.finished);$('visualClue').textContent=s.visual||'';$('question').textContent=s.finished?'🏆 Final leaderboard':s.question||'Waiting for host to start…';$('hostControls').classList.toggle('hidden',!host);$('next').disabled=s.finished||(s.index>=0&&!s.revealed);$('reveal').disabled=s.finished||s.index<0||s.revealed;const answers=$('answers');answers.replaceChildren();(s.options||[]).forEach((option,i)=>{const b=document.createElement('button');b.textContent=String.fromCharCode(65+i)+'. '+option;b.disabled=host||s.revealed||s.finished||s.yourAnswer>=0||s.index<0||(s.deadline&&Date.now()>=s.deadline);b.className=(s.yourAnswer===i?'chosen ':'')+(s.revealed&&s.correct===i?'correct':s.revealed&&s.yourAnswer===i?'wrong':'');b.onclick=()=>send({type:'trivia_answer',answer:i});answers.appendChild(b)});$('feedback').textContent=s.revealed?'Correct answer: '+s.options[s.correct]:s.yourAnswer>=0?'Answer submitted. Waiting for reveal.':'Choose one answer.';const scores=$('scores');scores.replaceChildren();s.players.forEach((p,i)=>{const d=document.createElement('div');d.className='score';d.textContent=(i+1)+'. '+p.name+' · '+p.score+' pts'+(p.answered?' ✓':'');scores.appendChild(d)})} $('host').onclick=()=>{if(!window.CinemaLocalParty){status('Host requires the Android app.');return}ip=window.CinemaLocalParty.start();if(!ip||ip.startsWith('ERROR:')){status(ip||'Unable to start server');return}host=true;connect(ip,{type:'trivia_create',seconds:Number($('seconds').value),industry:$('industry').value,difficulty:$('difficulty').value})};$('join').onclick=()=>{const code=$('code').value.trim(),name=$('name').value.trim();if(!/^\d{6}$/.test(code)||!name){status('Enter room code and your name.');return}const address=params.get('host')||location.hostname;if(!address||location.protocol==='file:'){status('Open the host join URL from the QR code.');return}roomCode=code;playerName=name;retry=0;connect(address,{type:'trivia_join',code,name,token:sessionStorage.getItem('trivia-token-'+code)||''})};$('next').onclick=()=>send({type:'trivia_next'});$('reveal').onclick=()=>send({type:'trivia_reveal'});if(params.has('code'))$('code').value=params.get('code');if(location.protocol==='http:')$('host').classList.add('hidden');})();</script><style id="cinema-button-help-style">
.info-icon{display:inline-flex;vertical-align:middle;align-items:center;justify-content:center;width:21px;height:21px;margin-left:8px;border-radius:50%;border:1px solid #f2c77d;color:#f2c77d;background:#251d2a;font:800 12px/1 system-ui;cursor:pointer;flex-shrink:0}
button{position:relative}
#buttonHelpDialog{max-width:min(92vw,420px);border:1px solid #f2c77d;border-radius:16px;background:#211a28;color:#fff;padding:22px;box-shadow:0 18px 55px #0009}
#buttonHelpDialog::backdrop{background:rgba(0,0,0,.72)}
#buttonHelpDialog h3{margin:0 0 10px;color:#f2c77d;font-size:1.2rem}
#buttonHelpDialog p{line-height:1.55;margin:0}
#buttonHelpDialog button{margin-top:18px;padding:9px 18px;border-radius:9px;background:#f2c77d;color:#241a25;font-weight:800;border:0}
.info-icon:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style>
<script id="cinema-button-help">
(()=>{'use strict';
if(window.__cinemaButtonHelpInstalled)return;window.__cinemaButtonHelpInstalled=true;
const descriptions=[
[/host game|host trivia|host codewords/i,'Create a new room on this device. The room code is then shared with players and the TV display.'],
[/join game|join room|join trivia/i,'Enter the room code and your player name to join the host’s active game.'],
[/copy.*(link|registration)/i,'Copy the player registration link so others can join without typing the room code.'],
[/place next bid|bid/i,'Submit the next available bid. The bid increases the current price and uses the player’s remaining budget if they win.'],
[/start game/i,'Begin the game for everyone in the room. Make sure the players have joined before starting.'],
[/pick next celebrity automatically/i,'Choose the next eligible celebrity from the selected industry and auction pool.'],
[/reveal celebrity/i,'Put the selected celebrity up for auction so connected players can begin bidding.'],
[/close auction|award highest bid/i,'End the current bidding round and award the contract to the highest bidder. If there is no bid, the lot is unsold.'],
[/start movie-making|movie-making|submit movie/i,'Move to movie creation. Players use their won contracts and set a production budget before submitting.'],
[/show results|reveal the winner/i,'Display the completed game results and player rankings.'],
[/connect tv/i,'Connect this screen to the room so it can display the live game for the audience.'],
[/auctioneer voice/i,'Turn the auctioneer voice announcements on or off for this display.'],
[/host trivia/i,'Create a trivia room. Share its room code with players and connect the TV display.'],
[/join trivia/i,'Join the trivia room using its six-digit code and your player name.'],
[/start \/ next question/i,'Start the first trivia question or advance after the previous question is complete.'],
[/reveal answers/i,'Show the correct answer and update the scores for the current question.'],
[/send clue/i,'Send the team’s clue to the players and TV. The clue-giver should avoid saying any word shown on the board.'],
[/end turn/i,'Finish the current team’s turn and pass play to the opposing team.'],
[/reveal secret key/i,'Show the secret team key to the captain only. Keep it hidden from the other team.'],
[/new board/i,'Generate a fresh board for a new round. The previous board and guesses will be replaced.'],
[/start 10-question round/i,'Begin a ten-question trivia round using the selected category and difficulty.'],
[/next question/i,'Move to the next question. Any unanswered question will be closed.'],
[/end round/i,'End the current trivia round and show the final scores.'],
[/play another round/i,'Return to setup to choose another category or difficulty and start a new round.'],
[/return to auctions/i,'Leave trivia and return to the main auction game.'],
[/report question/i,'Flag the current question for review. This does not change your score.'],
[/save report/i,'Submit the question report for review.'],
[/cancel/i,'Close this dialog without saving the changes.'],
[/back/i,'Return to the previous screen without starting a new game.']
];
function describe(button,label){const id=button.id||'';if(button.dataset.help)return button.dataset.help;for(const [re,txt] of descriptions)if(re.test(id+' '+label))return txt;return 'Use this control to '+label.replace(/[→←🎬🎲🔨🔒⚑]/g,'').replace(/\s+/g,' ').trim().toLowerCase()+'. If you are unsure, check the game instructions before continuing.'}
function install(){document.querySelectorAll('button:not(.info-icon):not(#closeButtonHelp)').forEach(b=>{if(b.dataset.infoAttached||b.closest('#buttonHelpDialog'))return;const label=(b.innerText||b.textContent||b.getAttribute('aria-label')||b.id||'Action').replace(/\s+/g,' ').trim();if(!label)return;
const icon=document.createElement('span');icon.className='info-icon';icon.textContent='i';icon.setAttribute('role','button');icon.setAttribute('tabindex','0');icon.setAttribute('aria-label','Information about '+label);icon.title='What does this button do?';
const show=e=>{e.preventDefault();e.stopPropagation();dialog.querySelector('h3').textContent=label;dialog.querySelector('p').textContent=describe(b,label);if(!dialog.open)dialog.showModal()};
icon.addEventListener('click',show);icon.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){show(e)}});b.appendChild(icon);b.dataset.infoAttached='1';
});
}
const dialog=document.createElement('dialog');dialog.id='buttonHelpDialog';dialog.innerHTML='<div><h3>Button information</h3><p></p><button type="button" id="closeButtonHelp">Got it</button></div>';document.body.appendChild(dialog);dialog.querySelector('#closeButtonHelp').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});
install();const observer=new MutationObserver(()=>install());observer.observe(document.body,{childList:true,subtree:true});
})();</script></body></html>
