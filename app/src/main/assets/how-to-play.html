<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>How to Play · Cinema Tycoon Bid</title><style>
:root{color-scheme:dark;--gold:#ffd184;--panel:#252035;--bg:#12131e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#43253e,var(--bg) 55%);color:#fff;font:16px system-ui,sans-serif}main{max-width:570px;margin:auto;padding:18px 16px 90px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}a{color:var(--gold);text-decoration:none}h1{font-size:26px;margin:22px 0 8px}h2{font-size:22px;margin:8px 0 12px}p{color:#d3cbd7;line-height:1.45}.eyebrow{color:var(--gold);font-size:12px;letter-spacing:.12em;text-transform:uppercase}.panel{background:var(--panel);border:1px solid #68546a;border-radius:18px;padding:18px;margin:20px 0;box-shadow:0 15px 35px #0004}.hero{text-align:center;font-size:58px;margin:12px 0}.steps{display:flex;gap:5px;margin:15px 0}.steps span{height:5px;flex:1;border-radius:9px;background:#534659}.steps span.active{background:var(--gold)}button{font:700 15px system-ui;border:1px solid #a78456;border-radius:12px;padding:12px 16px;cursor:pointer;min-height:46px;background:#30283a;color:#fff}button.primary{background:linear-gradient(120deg,#ffe0a2,#cc9348);color:#241a24;border-color:transparent}button:disabled{opacity:.35;cursor:default}.nav{display:flex;gap:9px;justify-content:space-between;margin-top:18px}.nav button{flex:1}.bidgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bidgrid button{display:flex;flex-direction:column;gap:5px;text-align:center;min-height:95px}.bidgrid small{color:#d9c6d5}.bidgrid strong{font-size:20px;color:var(--gold)}.stat{padding:10px 12px;background:#191c2a;border-radius:10px;margin:10px 0}.result{color:var(--gold);font-weight:800}.action-note{color:#a7e9c2;font-weight:650;min-height:24px}.cast{display:grid;gap:8px}.cast div{display:flex;justify-content:space-between;padding:10px;background:#191c2a;border-radius:9px}.cast b{color:var(--gold)}input[type=range]{width:100%;accent-color:#ffd184}.hint{font-size:13px;color:#bcb2c2}.skip{font-size:13px}#lesson[hidden]{display:none}@media(max-width:360px){.bidgrid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><main><header><a href="index.html">← Back to game</a><span class="eyebrow">Practice mode · Offline</span></header><h1>🎬 How to Play</h1><p>Learn by playing a quick example. Your real game and saved progress won't change.</p><div class="steps" id="progress"></div><section class="panel" id="lesson" aria-live="polite"></section><div class="nav"><button id="back">← Back</button><button id="next" class="primary">Next →</button></div><div class="nav"><button id="restart">↻ Restart</button><a class="skip" href="index.html">Skip tutorial</a></div></main><script>
(function(){
'use strict';
const $=id=>document.getElementById(id);let step=0,bids=[],winner=null,budget=100,production=20;
const money=n=>'₹'+Number(n).toFixed(0)+' Cr';
const lessons=[
{title:'Welcome to Cinema Tycoon Bid',tag:'Your mission',html:()=>'<div class="hero">🎬🏆</div><p>Every player starts with <b>₹100 Cr</b>. Buy celebrities in auctions, produce movies, and compete for the <b>highest total profit</b>.</p><div class="stat">🔨 Bid → 🎥 Produce → 🏆 Win</div>'},
{title:'Place your first bid',tag:'Practice auction',html:()=>'<div class="stat">🎭 Celebrity on auction: <b>Star Actor</b></div><p>Tap a player to bid. Each new bid increases the price by ₹1 Cr.</p><div class="bidgrid"><button data-player="Maya"><span>Maya</span><strong>BID '+money(bids.length?bids[bids.length-1].amount+1:1)+'</strong><small>₹100 Cr budget</small></button><button data-player="Ravi"><span>Ravi</span><strong>BID '+money(bids.length?bids[bids.length-1].amount+1:1)+'</strong><small>₹100 Cr budget</small></button></div><div class="stat">Highest bid: <b>'+(bids.length?bids[bids.length-1].player+' · '+money(bids[bids.length-1].amount):'None yet')+'</b></div><p class="action-note">'+(bids.length?'Great! You can bid again or continue.':'Place at least one bid to continue.')+'</p>'},
{title:'Award the celebrity',tag:'Auction result',html:()=>'<div class="hero">🔨</div><p>When bidding ends, the highest bidder wins the celebrity contract.</p><div class="stat">Highest bidder: <b>'+bids[bids.length-1].player+'</b><br>Winning price: <b>'+money(bids[bids.length-1].amount)+'</b></div><button id="award" class="primary" '+(winner?'disabled':'')+'>'+(winner?'✓ Contract awarded':'Award to highest bidder')+'</button><p class="action-note">'+(winner?'Contract added to '+winner+'.':'Tap Award to finish this practice auction.')+'</p><p class="hint">In the real game, a celebrity with no bids can become UNSOLD.</p>'},
{title:'Watch your budget',tag:'Budget basics',html:()=>'<div class="hero">💰</div><p>Each player has ₹100 Cr. Winning a contract reduces the budget available for future bids and movie production.</p><div class="stat">'+winner+' started with: <b>₹100 Cr</b></div><div class="stat">Celebrity contract: <b>−'+money(bids[bids.length-1].amount)+'</b></div><div class="stat result">Remaining budget: '+money(budget)+'</div><p class="hint">Losing a bid costs nothing. Only winning contracts use auction budget.</p>'},
{title:'Build your movie',tag:'Movie studio',html:()=>'<p>Combine a director, actor and actress, then set a production budget.</p><div class="cast"><div>🎬 Director <b>Director Demo</b></div><div>🎭 Actor <b>Star Actor</b></div><div>✨ Actress <b>Actress Demo</b></div></div><p class="hint">This is a demonstration cast. In a real game you must win the required contracts.</p><label>Production budget: <b id="productionAmount">'+money(production)+'</b><input id="production" type="range" min="10" max="40" step="5" value="'+production+'"></label><p class="hint">Real game rule: production budget must be at least 30% of the auction cost of the selected cast.</p>'},
{title:'Understand the winner',tag:'Profit and results',html:()=>'<div class="hero">🏆</div><p>Movies earn simulated box-office revenue. Your total profit determines your ranking.</p><div class="stat">Example movie revenue: <b>₹80 Cr</b></div><div class="stat">Example total movie cost: <b>₹50 Cr</b></div><div class="stat result">Example profit: ₹30 Cr</div><p>ROI = Profit ÷ Total Cost × 100. Here, ROI is <b>60%</b>.</p><p class="hint">These are illustrative numbers. Actual game results depend on the movie-building calculations.</p>'}
];
function render(){const l=lessons[step];$('progress').innerHTML=lessons.map((_,i)=>'<span class="'+(i<=step?'active':'')+'"></span>').join('');$('lesson').innerHTML='<span class="eyebrow">'+(step+1)+' / '+lessons.length+' · '+l.tag+'</span><h2>'+l.title+'</h2>'+l.html();$('back').disabled=step===0;$('next').disabled=(step===1&&!bids.length)||(step===2&&!winner);$('next').textContent=step===lessons.length-1?'Finish ✓':'Next →';document.querySelectorAll('[data-player]').forEach(btn=>btn.addEventListener('click',()=>{bids.push({player:btn.dataset.player,amount:bids.length?bids[bids.length-1].amount+1:1});render()}));const award=$('award');if(award)award.addEventListener('click',()=>{winner=bids[bids.length-1].player;budget=100-bids[bids.length-1].amount;render()});const range=$('production');if(range)range.addEventListener('input',()=>{production=Number(range.value);$('productionAmount').textContent=money(production)})}
$('back').addEventListener('click',()=>{if(step>0){step--;render()}});$('next').addEventListener('click',()=>{if(step===lessons.length-1){location.href='index.html';return}if((step===1&&!bids.length)||(step===2&&!winner))return;step++;render();window.scrollTo(0,0)});$('restart').addEventListener('click',()=>{step=0;bids=[];winner=null;budget=100;production=20;render()});render();
})();
</script></body></html>
