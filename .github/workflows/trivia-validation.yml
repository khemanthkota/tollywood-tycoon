name: Trivia validation and film-credit candidate import
on:
  push:
    paths:
      - 'trivia/**'
      - '.github/workflows/trivia-validation.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run trivia tests
        run: node --test trivia/*.test.mjs
      - name: Import broader multilingual film-credit candidates
        continue-on-error: true
        run: node trivia/import-wikidata.mjs --discover
      - name: Generate up to 9000 draft questions
        if: success()
        run: node trivia/generate-9000-drafts.mjs
      - name: Generate quality-gated question batch
        if: success()
        run: node trivia/generate-quality-gated.mjs
      - name: Report candidate coverage
        if: success()
        run: node trivia/report-coverage.mjs
      - name: Upload candidate credits for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filmography-candidates-and-drafts
          path: |
            trivia/candidates/wikidata-credits.json
            trivia/candidates/quality-gated-questions.json
            trivia/candidates/quality-report.json
            trivia/candidates/bulk-drafts.json
            trivia/candidates/bulk-draft-report.json
          if-no-files-found: ignore
