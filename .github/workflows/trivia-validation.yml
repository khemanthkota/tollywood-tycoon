name: Trivia validation and film-credit candidate import
on:
  push:
    paths:
      - 'trivia/**'
      - '.github/workflows/trivia-validation.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run trivia tests
        run: node --test trivia/*.test.mjs
      - name: Import multilingual film-credit candidates
        continue-on-error: true
        run: node trivia/import-wikidata-batched.mjs
      - name: Merge available source candidates
        run: node trivia/merge-sources.mjs trivia/candidates/wikidata-credits.json
      - name: Generate up to 18000 draft questions
        run: node trivia/generate-9000-drafts.mjs trivia/candidates/merged-credits.json
      - name: Audit draft answers, ambiguity, sources and difficulty risks
        run: node trivia/audit-bulk-drafts.mjs
      - name: Generate quality-gated candidates
        run: node trivia/generate-quality-gated.mjs trivia/candidates/merged-credits.json
      - name: Report candidate coverage
        run: node trivia/report-coverage.mjs
      - name: Upload draft artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filmography-candidates-and-drafts
          path: |
            trivia/candidates/wikidata-credits.json
            trivia/candidates/import-report.json
            trivia/candidates/merged-credits.json
            trivia/candidates/quality-gated-questions.json
            trivia/candidates/quality-report.json
            trivia/candidates/bulk-drafts.json
            trivia/candidates/bulk-draft-report.json
            trivia/candidates/draft-audit-report.json
            trivia/candidates/draft-audit-results.json
          if-no-files-found: ignore
